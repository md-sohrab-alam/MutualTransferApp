name: Android Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type to assemble"
        required: true
        default: both
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.build_type }}"
          else
            TYPE="both"
          fi

          case "$TYPE" in
            debug)
              echo "tasks=:app:assembleDebug" >> "$GITHUB_OUTPUT"
              echo "upload_debug=true" >> "$GITHUB_OUTPUT"
              echo "upload_release=false" >> "$GITHUB_OUTPUT"
              ;;
            release)
              echo "tasks=:app:assembleRelease" >> "$GITHUB_OUTPUT"
              echo "upload_debug=false" >> "$GITHUB_OUTPUT"
              echo "upload_release=true" >> "$GITHUB_OUTPUT"
              ;;
            both)
              echo "tasks=:app:assembleDebug :app:assembleRelease" >> "$GITHUB_OUTPUT"
              echo "upload_debug=true" >> "$GITHUB_OUTPUT"
              echo "upload_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown build type: $TYPE"
              exit 1
              ;;
          esac

          echo "Selected build type: $TYPE"

      - name: Build APK(s)
        run: ./gradlew ${{ steps.targets.outputs.tasks }} --stacktrace --no-daemon

      - name: Upload Debug APK
        if: steps.targets.outputs.upload_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: steps.targets.outputs.upload_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
            !app/build/outputs/apk/release/*-aligned.apk
          if-no-files-found: error
          retention-days: 30
