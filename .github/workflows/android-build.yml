name: Android CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Artifacts to build (AAB for Play Store, APK for direct install)"
        required: true
        default: both
        type: choice
        options:
          - both
          - aab
          - apk
      create_github_release:
        description: "Create a GitHub Release and attach the built artifact(s)"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag (e.g. v1.3). Leave empty to use versionName from build.gradle.kts"
        required: false
        default: ""
        type: string

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Release (${{ github.event_name == 'workflow_dispatch' && inputs.artifacts || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve build targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.artifacts }}"
          else
            # Auto builds on push: both Play Store AAB and installable APK
            TYPE="both"
          fi

          case "$TYPE" in
            apk)
              echo "tasks=:app:assembleRelease" >> "$GITHUB_OUTPUT"
              echo "want_apk=true" >> "$GITHUB_OUTPUT"
              echo "want_aab=false" >> "$GITHUB_OUTPUT"
              ;;
            aab)
              echo "tasks=:app:bundleRelease" >> "$GITHUB_OUTPUT"
              echo "want_apk=false" >> "$GITHUB_OUTPUT"
              echo "want_aab=true" >> "$GITHUB_OUTPUT"
              ;;
            both)
              echo "tasks=:app:assembleRelease :app:bundleRelease" >> "$GITHUB_OUTPUT"
              echo "want_apk=true" >> "$GITHUB_OUTPUT"
              echo "want_aab=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown artifacts option: $TYPE"
              exit 1
              ;;
          esac

          echo "Selected artifacts: $TYPE"

      - name: Build release artifact(s)
        run: bash ./gradlew ${{ steps.targets.outputs.tasks }} --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Prepare artifacts for upload
        id: files
        shell: bash
        run: |
          RELEASE_FILES=""

          if [ "${{ steps.targets.outputs.want_apk }}" = "true" ]; then
            SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | grep -v aligned | head -n 1)
            APK_NAME="mutual-transfer-release-v-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
            cp "$SRC" "$APK_NAME"
            echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"
            RELEASE_FILES="$APK_NAME"
            echo "Prepared APK: $APK_NAME"
          fi

          if [ "${{ steps.targets.outputs.want_aab }}" = "true" ]; then
            SRC=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
            AAB_NAME="mutual-transfer-release-v-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
            cp "$SRC" "$AAB_NAME"
            echo "aab_name=$AAB_NAME" >> "$GITHUB_ENV"
            if [ -n "$RELEASE_FILES" ]; then
              RELEASE_FILES="$RELEASE_FILES"$'\n'"$AAB_NAME"
            else
              RELEASE_FILES="$AAB_NAME"
            fi
            echo "Prepared AAB: $AAB_NAME"
          fi

          {
            echo "release_files<<EOF"
            echo "$RELEASE_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.targets.outputs.want_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutual_transfer_apk_v_${{ steps.version.outputs.name }}
          path: ${{ env.apk_name }}
          retention-days: 30

      - name: Upload AAB artifact
        if: steps.targets.outputs.want_aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutual_transfer_aab_v_${{ steps.version.outputs.name }}
          path: ${{ env.aab_name }}
          retention-days: 30

      - name: Resolve release tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_github_release
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${{ steps.version.outputs.name }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mutual Transfer ${{ steps.tag.outputs.name }}
          body: |
            Automated release build from `${{ github.ref_name }}` (`${{ github.sha }}`).

            - **versionName:** ${{ steps.version.outputs.name }}
            - **versionCode:** ${{ steps.version.outputs.code }}
            - **Play Store:** use the `.aab` file
          files: ${{ steps.files.outputs.release_files }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
