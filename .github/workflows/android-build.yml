name: Android CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Create a GitHub Release and attach the signed APK"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag (e.g. v1.3). Leave empty to use versionName from build.gradle.kts"
        required: false
        default: ""
        type: string

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Generate Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Prepare APK for upload
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | grep -v aligned | head -n 1)
          APK_NAME="mutual-transfer-release-v-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$SRC" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"
          echo "Prepared: $APK_NAME from $SRC"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutual_transfer_release_v_${{ steps.version.outputs.name }}
          path: ${{ env.apk_name }}
          retention-days: 30

      - name: Resolve release tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_github_release
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${{ steps.version.outputs.name }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mutual Transfer ${{ steps.tag.outputs.name }}
          body: |
            Automated release build from `${{ github.ref_name }}` (`${{ github.sha }}`).

            - **versionName:** ${{ steps.version.outputs.name }}
            - **versionCode:** ${{ steps.version.outputs.code }}
          files: ${{ env.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
